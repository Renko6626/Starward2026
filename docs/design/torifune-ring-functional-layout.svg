<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
<title id="title">环形低重力生态实验站：功能与旋转分组</title>
<desc id="desc">固定核心、生态主环与反向配平副环的功能清单及待设计的跨组接口。框图不表示真实设备位置或比例。</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif}</style>
<rect x="0" y="0" width="1800" height="1220" rx="0" fill="#101923"/>
<text x="45" y="33" dominant-baseline="text-before-edge" font-size="43" font-weight="700" fill="#edf0ef">环形低重力生态实验站</text>
<text x="47" y="97" dominant-baseline="text-before-edge" font-size="25" font-weight="400" fill="#a9b7c2">功能与旋转分组草图   /   地月 L4   /   浪漫工业风格</text>
<rect x="40" y="155" width="660" height="915" rx="10" fill="#172431" stroke="#8db3d1" stroke-width="2"/>
