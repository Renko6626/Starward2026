<text x="92" y="353" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">4 人 / 驻留 2–3 个月</text>
<rect x="380" y="275" width="285" height="112" rx="7" fill="#203241" stroke="#8db3d1" stroke-width="2"/>
