<text x="92" y="472" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">样品处理、分析与保存</text>
<text x="92" y="501" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">固定轴线 / 微重力工况</text>
