<text x="397" y="324" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">检查、暂存与转运</text>
<text x="397" y="353" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">外部托盘与抓取点</text>
