<text x="397" y="436" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#8db3d1">能源与热控</text>
<text x="397" y="472" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">4 组光伏翼 / 2 组散热板</text>
<text x="397" y="501" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">板面垂直 / 独立根部机构</text>
