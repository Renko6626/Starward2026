<text x="1127" y="588" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">水、气体、营养与废物处理主要随环旋转</text>
<text x="1127" y="617" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">四组辐条 / 交错周向桁架 / 舱段安装座</text>
<text x="1127" y="646" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">转接基座、抓取点与服务管路</text>
