<text x="92" y="584" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#8db3d1">独立挂接推进尾段</text>
<text x="92" y="620" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">6 主贮箱 / 4 主发动机</text>
<text x="92" y="649" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">双组元化学主推进</text>
<text x="92" y="678" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">支座、推力框与供给设备</text>
