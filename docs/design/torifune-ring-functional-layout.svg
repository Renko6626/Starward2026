<text x="92" y="765" dominant-baseline="text-before-edge" font-size="23" font-weight="700" fill="#8db3d1">移动机械臂系统</text>
<text x="92" y="801" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">两支机械臂：货运/装配与设备检修</text>
