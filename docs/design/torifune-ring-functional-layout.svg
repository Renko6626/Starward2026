<text x="397" y="649" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">前后分组单组元 RCS</text>
<text x="397" y="678" dominant-baseline="text-before-edge" font-size="20" font-weight="400" fill="#a9b7c2">短支架、阀箱与管路</text>
