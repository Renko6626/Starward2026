<title id="title">鸟船科研站两种体块布局比较</title><desc id="desc">A 纵向主梁与错位生态单元；B 紧凑服务核心与分叉生态单元。两者都标示通路、桁架、安装与维护候选空间、能源热控展开区和推进喷流避让区。布局和尺寸尚未定稿。</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;fill:#263748}.title{font-size:31px;font-weight:650}.heading{font-size:24px;font-weight:600}.label{font-size:20px;font-weight:550}.note{font-size:17px;fill:#617484}.small{font-size:15px;fill:#617484}</style></defs><rect width="1720" height="1430" fill="#fafbfd"/>
<text class="title" x="55" y="56">科研站体块：先比较连接与操作空间</text>
<text class="note" x="55" y="89">同一组功能区的两种放置方式；框形和相对位置为候选，不标注未经推算的整站尺寸。</text>
<text class="note" x="55" y="119">灰线为承力结构候选；蓝线为压力通路；橙色虚线为装配、维护、展开或喷流需要保留的空间。</text>
<text class="heading" x="55" y="177">A　纵向主梁 + 错位生态单元（当前选用）</text>
<text class="note" x="55" y="208">轴向组织清楚，便于分批扩建；生态单元之间的通路和管线更长。</text>
