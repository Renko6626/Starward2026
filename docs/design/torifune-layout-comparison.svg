<text class="note" x="55" y="1337">比较顺序：先保持生态空间与任务一致，再比较连接长度、安装顺序、检修可达性与质心；不以剪影好看直接选方案。</text>
<text class="note" x="55" y="1374">两方案均无旋转环；人工重力为分区黑箱设备。压力结构 / 运载路线、动力、质量与功率预算尚未完成。</text>
